[project]
name = "scope"
version = "0.1.0"
description = "SCOPE - Topic modeling CLI for finding contiguous conversation blocks"
authors = [{name = "SCOPE Contributors", email = ""}]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "spacy>=3.7.0",
    "nltk>=3.8.0",
    "keybert>=0.8.0",
    "pyspellchecker>=0.8.0",
    "scikit-learn>=1.3.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1.0",
    "pgvector>=0.2.0",
]
sentence-transformers = [
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
]
jina = [
    "httpx>=0.24.0",
]
dev = [
    "pytest>=7.4.0",
]
all = [
    "scope[sentence-transformers,jina,postgres,dev]",
]

[project.scripts]
scope = "scope.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
